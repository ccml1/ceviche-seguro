# Pipeline CI/CD de Ceviche Seguro
#  - CI (todas las ramas con PR hacia develop o main): instala, prueba (unitarias + integración con PostgreSQL),
#    mide cobertura, revisa vulnerabilidades de dependencias y busca secretos expuestos (DevSecOps).
#  - CD (solo push a main): empaqueta, despliega en Azure App Service y hace una prueba de humo contra /health.
name: CI-CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

jobs:
  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar claves, tokens y contraseñas en el historial
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact -v

  ci:
    name: Build y pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cevicheseguro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cevicheseguro_test
      JWT_SECRET: secreto-solo-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Revisión de sintaxis
        run: npm run check
      - name: Pruebas unitarias e integración con cobertura
        run: npm test -- --coverage
      - name: Auditoría de dependencias (falla si hay vulnerabilidades altas)
        run: npm audit --omit=dev --audit-level=high
      - name: Empaquetar artefacto de producción
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm ci --omit=dev
          zip -qr app.zip src db public node_modules package.json package-lock.json
      - name: Publicar artefacto
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip
          retention-days: 7

  deploy:
    name: Despliegue en Azure App Service
    needs: [secretos, ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - name: Desplegar en App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
      - name: Prueba de humo contra /health
        run: |
          URL="${{ vars.SMOKE_URL }}"
          [ -z "$URL" ] && URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$URL"
